name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same branch/PR when new commits arrive
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend: Lint & Format ────────────────────────────────────────────────
  backend-lint:
    name: Backend · Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Only ruff needed here — no full dep install so this job stays fast
      - name: Install ruff
        run: pip install --quiet ruff

      - name: ruff check (lint)
        run: ruff check app/ tests/
        working-directory: backend

      - name: ruff format --check
        run: ruff format --check app/ tests/
        working-directory: backend

  # ── Backend: Tests ───────────────────────────────────────────────────────
  backend-test:
    name: Backend · Tests
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements.lock

      - name: Install dependencies
        run: pip install --quiet -e ".[dev]" -c requirements.lock
        working-directory: backend

      - name: pytest — unit tests (no AI / no DB required)
        # All tests use inspect.getsource() or pure rule-engine computation.
        # conftest.py injects mock env vars so Settings() doesn't need real infra.
        # -m "not ai_eval" skips tests that call live Anthropic API.
        run: |
          pytest tests/ \
            -m "not ai_eval" \
            -v \
            --tb=short \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml
        working-directory: backend

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7

  # ── Backend: Type Check ──────────────────────────────────────────────────
  backend-typecheck:
    name: Backend · Type Check (mypy)
    runs-on: ubuntu-latest
    # Informational only — strict mode surfaces pre-existing issues in third-party
    # stubs and generated models. Unblock PRs while incrementally fixing type errors.
    continue-on-error: true
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements.lock

      - name: Install dependencies
        run: pip install --quiet -e ".[dev]" -c requirements.lock
        working-directory: backend

      - name: mypy
        run: mypy app/
        working-directory: backend

  # ── Frontend: Lint, Types & Tests ────────────────────────────────────────
  frontend-ci:
    name: Frontend · Lint, Types & Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: ESLint
        run: npm run lint
        working-directory: frontend

      - name: TypeScript type check
        run: npm run type-check
        working-directory: frontend

      - name: Vitest
        run: npm run test
        working-directory: frontend

  # ── Security: Dependency Audit ────────────────────────────────────────────
  security-audit:
    name: Security · Dependency Audit
    runs-on: ubuntu-latest
    # Informational — new CVEs in deps shouldn't block unrelated PRs,
    # but must be visible and tracked. Flip continue-on-error: false when
    # the team has a formal vulnerability management process in place.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements.lock

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend deps
        run: pip install --quiet -e ".[dev]" -c requirements.lock
        working-directory: backend

      - name: pip-audit (Python CVE scan)
        run: pip install --quiet pip-audit && pip-audit --desc
        working-directory: backend

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: npm audit (JS CVE scan)
        # --audit-level=high: only fail on high/critical; moderate findings are
        # informational (many are in devDeps and not exploitable in production).
        run: npm audit --audit-level=high
        working-directory: frontend
