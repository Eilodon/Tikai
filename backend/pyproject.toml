[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tikai-backend"
version = "0.4.1"
description = "Tikai backend — TikTok Shop analytics for Vietnamese sellers"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.12",     # file upload

    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",              # PostgreSQL async driver
    "alembic>=1.14.0",

    # Validation & config
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",

    # Data processing
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",             # Excel support
    "chardet>=5.2.0",              # encoding detection

    # AI
    "anthropic>=0.40.0",

    # Cache & queue
    "redis>=5.2.0",
    "arq>=0.26.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",  # JWT validation
    "httpx>=0.27.0",               # async HTTP client (Supabase calls)

    # Utils
    "structlog>=24.4.0",           # structured logging
    "sentry-sdk[fastapi]>=2.19.0", # error tracking
    "slowapi>=0.1.9",              # LOW-3: rate limiting
    "sendgrid>=6.11.0",            # F-2-01: weekly digest email (was missing → feature silently broken)
    "pywebpush>=2.0.0",            # Web Push notifications via VAPID protocol
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",               # test client
    "factory-boy>=3.3.0",          # fixtures
    "ruff>=0.8.0",                 # linter + formatter
    "mypy>=1.13.0",
    "types-redis>=4.6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "ai_eval: marks tests that call live AI API (deselect with -m 'not ai_eval')",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["app"]
