name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same branch/PR when new commits arrive
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend: Lint & Format ────────────────────────────────────────────────
  backend-lint:
    name: Backend · Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Only ruff needed here — no full dep install so this job stays fast
      - name: Install ruff
        run: pip install --quiet ruff

      - name: ruff check (lint)
        run: ruff check app/ tests/
        working-directory: backend

      - name: ruff format --check
        run: ruff format --check app/ tests/
        working-directory: backend

  # ── Backend: Tests (unit) ────────────────────────────────────────────────
  backend-test:
    name: Backend · Unit Tests
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements.lock

      - name: Install dependencies
        run: pip install --quiet -e ".[dev]" -c requirements.lock
        working-directory: backend

      - name: pytest — unit tests (no AI / no DB required)
        # All tests use inspect.getsource() or pure rule-engine computation.
        # conftest.py injects mock env vars so Settings() doesn't need real infra.
        # -m "not ai_eval and not integration" skips live-API and DB-backed tests.
        run: |
          pytest tests/ \
            -m "not ai_eval and not integration" \
            -v \
            --tb=short \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml
        working-directory: backend

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7

  # ── Backend: Integration Tests (real Postgres + Redis) ───────────────────
  backend-integration:
    name: Backend · Integration Tests
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://tikai:tikai@localhost:5432/tikai_test
      SUPABASE_URL: https://test.supabase.co
      SUPABASE_ANON_KEY: test_anon_key_ci
      SUPABASE_SERVICE_ROLE_KEY: test_service_role_key_ci
      SUPABASE_JWT_SECRET: ci_jwt_secret_that_is_32_chars_long__
      ANTHROPIC_API_KEY: test_anthropic_key_ci
      REDIS_URL: redis://localhost:6379
      ALLOWED_ORIGINS: '["http://localhost:3000"]'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tikai
          POSTGRES_PASSWORD: tikai
          POSTGRES_DB: tikai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements.lock

      - name: Install dependencies
        run: pip install --quiet -e ".[dev]" -c requirements.lock
        working-directory: backend

      - name: Run Alembic migrations on test DB
        run: alembic upgrade head
        working-directory: backend

      - name: Seed fee_config for integration tests
        run: python -c "
import asyncio, os
from decimal import Decimal
from sqlalchemy.ext.asyncio import create_async_engine, async_sessionmaker, AsyncSession
from app.models.fee_config import FeeConfig
from datetime import date

async def seed():
    engine = create_async_engine(os.environ['DATABASE_URL'])
    sm = async_sessionmaker(bind=engine, class_=AsyncSession, expire_on_commit=False)
    async with sm() as db:
        for platform in ('tiktok', 'shopee', 'lazada'):
            db.add(FeeConfig(
                platform=platform,
                version=f'2026-VN-v3-ci',
                platform_commission_rate=Decimal('0.04'),
                category_overrides={},
                effective_from=date(2026, 1, 1),
            ))
        await db.commit()
    await engine.dispose()

asyncio.run(seed())
"
        working-directory: backend

      - name: pytest — integration tests (real DB + Redis)
        run: |
          pytest tests/ \
            -m "integration" \
            -v \
            --tb=short
        working-directory: backend

  # ── Backend: Type Check ──────────────────────────────────────────────────
  backend-typecheck:
    name: Backend · Type Check (mypy)
    runs-on: ubuntu-latest
    # Informational only — strict mode surfaces pre-existing issues in third-party
    # stubs and generated models. Unblock PRs while incrementally fixing type errors.
    continue-on-error: true
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements.lock

      - name: Install dependencies
        run: pip install --quiet -e ".[dev]" -c requirements.lock
        working-directory: backend

      - name: mypy
        run: mypy app/
        working-directory: backend

  # ── Frontend: Lint, Types, Tests & Build ─────────────────────────────────
  frontend-ci:
    name: Frontend · Lint, Types, Vitest & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: ESLint
        run: npm run lint
        working-directory: frontend

      - name: TypeScript type check
        run: npm run type-check
        working-directory: frontend

      - name: Vitest
        run: npm run test
        working-directory: frontend

      # Verify the production build succeeds — catches Next.js build-time errors
      # that TypeScript and Vitest won't catch (missing env vars, import issues, etc.)
      - name: Next.js production build
        run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_SUPABASE_URL: https://test.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test_anon_key_ci

  # ── Security: Dependency Audit ────────────────────────────────────────────
  security-audit:
    name: Security · Dependency Audit
    runs-on: ubuntu-latest
    # HIGH and CRITICAL CVEs block the pipeline — they require immediate action.
    # Moderate CVEs remain informational; flip continue-on-error to false when
    # the team has a formal vulnerability management process in place.
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements.lock

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend deps
        run: pip install --quiet -e ".[dev]" -c requirements.lock
        working-directory: backend

      - name: pip-audit (Python CVE scan) — fail on any severity
        run: pip install --quiet pip-audit && pip-audit --desc
        working-directory: backend

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: npm audit (JS CVE scan) — fail on high/critical only
        # moderate findings are informational (many are in devDeps and not exploitable).
        run: npm audit --audit-level=high
        working-directory: frontend
